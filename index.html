<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Glow Studio -- appointment scheduler for a solo esthetician -->
<title>Glow Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
  href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@400;500;600;700&display=swap"
  rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.js"></script>

<style>
  /* Layout concept: fixed side nav (desktop) / bottom tab bar (phone), content column
     of cards over a soft warm surface; a single floating action button starts a booking. */
  :root {
    --bg: #fbf4f2;
    --surface: #ffffff;
    --surface-alt: #fdf0ee;
    --border: #f0dcd8;
    --text: #2c2222;
    --text-soft: #8a7877;
    --accent: #b5466f;
    --accent-dark: #8a3455;
    --accent-soft: #f7e3ec;
    --success: #3f8f5f;
    --success-soft: #e5f3e9;
    --danger: #c0473f;
    --danger-soft: #fbe9e7;
    --warning: #b1792c;
    --warning-soft: #faf0df;
    --shadow: 0 1px 2px rgba(44, 34, 34, .04), 0 8px 24px -12px rgba(44, 34, 34, .18);
    --hero-from: #b5466f;
    --hero-to: #7e2f4d;
    --hero-text: #fff;
    --font-display: 'Frank Ruhl Libre', Georgia, 'Times New Roman', serif;
    --font-body: 'Heebo', Arial, sans-serif;
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #211a1a;
      --surface: #2a2222;
      --surface-alt: #332828;
      --border: #443535;
      --text: #f3e9e7;
      --text-soft: #b7a4a2;
      --accent: #e487ac;
      --accent-dark: #f0a9c4;
      --accent-soft: #3a2630;
      --success: #7bc999;
      --success-soft: #20332a;
      --danger: #e2847c;
      --danger-soft: #3a2524;
      --warning: #dcae6b;
      --warning-soft: #392e1e;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px -12px rgba(0, 0, 0, .5);
      --hero-from: #7d3853;
      --hero-to: #44202f;
      --hero-text: #fdeef4;
      color-scheme: dark;
    }
  }

  :root[data-theme="dark"] {
    --bg: #211a1a;
    --surface: #2a2222;
    --surface-alt: #332828;
    --border: #443535;
    --text: #f3e9e7;
    --text-soft: #b7a4a2;
    --accent: #e487ac;
    --accent-dark: #f0a9c4;
    --accent-soft: #3a2630;
    --success: #7bc999;
    --success-soft: #20332a;
    --danger: #e2847c;
    --danger-soft: #3a2524;
    --warning: #dcae6b;
    --warning-soft: #392e1e;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px -12px rgba(0, 0, 0, .5);
    --hero-from: #7d3853;
    --hero-to: #44202f;
    --hero-text: #fdeef4;
    color-scheme: dark;
  }

  * {
    box-sizing: border-box;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    direction: rtl;
    min-height: 100%;
  }

  html,
  body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }

  h1,
  h2,
  h3,
  .brand {
    font-family: var(--font-display);
  }

  button,
  input,
  select,
  textarea {
    font-family: inherit;
    color: inherit;
  }

  a {
    color: var(--accent);
  }

  ::selection {
    background: var(--accent-soft);
    color: var(--accent-dark);
  }

  #app {
    height: 100%;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- Login ---------- */
  .login-screen {
    height: 100%;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    background:
      radial-gradient(60% 50% at 85% 10%, var(--accent-soft), transparent 60%),
      var(--bg);
  }

  .login-card {
    width: 100%;
    max-width: 380px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 36px 28px;
    box-shadow: var(--shadow);
  }

  .login-brand {
    text-align: center;
    margin-bottom: 28px;
  }

  .login-brand .mark {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    margin: 0 auto 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--accent-soft);
    color: var(--accent-dark);
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 700;
  }

  .login-brand h1 {
    font-size: 22px;
    margin: 0 0 4px;
    font-weight: 700;
  }

  .login-brand p {
    margin: 0;
    color: var(--text-soft);
    font-size: 13.5px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 16px;
  }

  .field label {
    font-size: 12.5px;
    color: var(--text-soft);
    font-weight: 600;
  }

  .field input {
    height: 44px;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0 13px;
    font-size: 15px;
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: border-color .15s;
  }

  .field input:focus {
    border-color: var(--accent);
  }

  .btn {
    border: none;
    border-radius: 10px;
    padding: 12px 18px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform .08s, opacity .15s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    white-space: nowrap;
  }

  .btn:active {
    transform: scale(.98);
  }

  .btn:disabled {
    opacity: .55;
    cursor: not-allowed;
  }

  .btn-primary {
    background: var(--accent);
    color: #fff;
  }

  .btn-block {
    width: 100%;
  }

  .btn-primary:hover:not(:disabled) {
    background: var(--accent-dark);
  }

  .btn-ghost {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
  }

  .btn-ghost:hover {
    background: var(--surface-alt);
  }

  .btn-danger-text {
    background: transparent;
    color: var(--danger);
    padding: 8px 10px;
  }

  .login-error {
    background: var(--danger-soft);
    color: var(--danger);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    margin-bottom: 14px;
  }

  .login-hint {
    margin-top: 18px;
    text-align: center;
    font-size: 12px;
    color: var(--text-soft);
    line-height: 1.6;
  }

  /* ---------- Shell ---------- */
  /* Nothing scrolls at the page level: the shell owns exactly one viewport
     height, and .content is the only region allowed to scroll inside it. */
  .shell {
    display: flex;
    flex: 1;
    height: 100vh;
    height: 100dvh;
    min-height: 0;
    overflow: hidden;
  }

  .sidebar {
    height: 100%;
    width: 224px;
    flex-shrink: 0;
    background: var(--surface);
    border-inline-start: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 20px 14px;
    gap: 4px;
  }

  .sidebar .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 8px 22px;
  }

  .sidebar .brand .mark {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--accent-soft);
    color: var(--accent-dark);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 15px;
    flex-shrink: 0;
  }

  .sidebar .brand span {
    font-weight: 700;
    font-size: 16.5px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 10px 12px;
    border-radius: 10px;
    cursor: pointer;
    color: var(--text-soft);
    font-size: 14.5px;
    font-weight: 600;
    border: none;
    background: none;
    text-align: right;
    width: 100%;
  }

  .nav-item .ic {
    display: inline-flex;
    flex-shrink: 0;
  }

  .nav-item:hover {
    background: var(--surface-alt);
    color: var(--text);
  }

  .nav-item.active {
    background: var(--accent-soft);
    color: var(--accent-dark);
  }

  .sidebar-footer {
    margin-top: auto;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }

  .sidebar-footer .user-email {
    font-size: 11.5px;
    color: var(--text-soft);
    padding: 0 12px 8px;
    word-break: break-all;
  }

  .main {
    flex: 1;
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .topbar {
    position: relative;
    z-index: 10;
    flex-shrink: 0;
    background: var(--bg);
    padding: 20px 24px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    border-bottom: 1px solid transparent;
  }

  .topbar h2 {
    font-size: 21px;
    margin: 0;
    font-weight: 700;
  }

  .topbar .sub {
    font-size: 13px;
    color: var(--text-soft);
    margin-top: 2px;
  }

  .content {
    padding: 4px 24px 24px;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    scrollbar-gutter: stable;
    display: flex;
    flex-direction: column;
  }

  /* only the views with the floating button keep room for it */
  .content.has-fab {
    padding-bottom: 86px;
  }

  /* ---------- Cards / lists ---------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow);
  }

  .empty-state {
    text-align: center;
    padding: 52px 20px;
    color: var(--text-soft);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .empty-state .ic {
    display: inline-flex;
  }

  .empty-state strong {
    color: var(--text);
    font-size: 15px;
  }

  .appt-list {
    display: flex;
    flex-direction: column;
  }

  .appt-row {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
  }

  .appt-row:last-child {
    border-bottom: none;
  }

  .appt-time {
    width: 92px;
    flex-shrink: 0;
    font-weight: 700;
    font-size: 14.5px;
    font-variant-numeric: tabular-nums;
    color: var(--accent-dark);
  }

  .appt-time .dur {
    display: block;
    font-weight: 400;
    font-size: 11.5px;
    color: var(--text-soft);
    margin-top: 2px;
  }

  .appt-main {
    flex: 1;
    min-width: 0;
  }

  .appt-main .client {
    font-weight: 700;
    font-size: 15px;
  }

  .appt-main .service {
    color: var(--text-soft);
    font-size: 13px;
    margin-top: 2px;
  }

  .appt-main .notes {
    color: var(--text-soft);
    font-size: 12px;
    margin-top: 4px;
    font-style: italic;
  }

  .appt-phone {
    font-size: 12.5px;
    color: var(--text-soft);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .appt-actions {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }

  .icon-btn {
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: 8px;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 14px;
    color: var(--text-soft);
  }

  .icon-btn:hover {
    background: var(--surface-alt);
    color: var(--text);
  }

  .icon-btn:disabled {
    opacity: .5;
    cursor: not-allowed;
  }

  .badge {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 999px;
    white-space: nowrap;
  }

  .badge-done {
    background: var(--success-soft);
    color: var(--success);
  }

  .badge-cancelled {
    background: var(--danger-soft);
    color: var(--danger);
    text-decoration: line-through;
  }

  .fab {
    position: fixed;
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    left: 28px;
    z-index: 20;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 15px 22px;
    font-size: 15px;
    font-weight: 700;
    box-shadow: 0 10px 28px -8px rgba(181, 70, 111, .55);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .fab:hover {
    background: var(--accent-dark);
  }

  /* ---------- Month calendar ---------- */
  /* shared by the day view and the month view */
  .view-nav {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
    flex-shrink: 0;
  }

  /* the calendar fills whatever height is left instead of scrolling */
  .month-view {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .month-view .view-nav {
    margin-bottom: 2px;
  }

  .month-head {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 8px;
    flex-shrink: 0;
  }

  .month-head span {
    font-size: 11.5px;
    font-weight: 700;
    color: var(--text-soft);
    text-align: center;
  }

  .month-grid {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    grid-template-rows: repeat(6, minmax(0, 1fr));
    gap: 8px;
  }

  .month-day {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px 9px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
    min-height: 0;
    overflow: hidden;
    text-align: start;
    font-family: inherit;
    color: inherit;
  }

  .month-day:hover {
    border-color: var(--accent);
  }

  /* date + "open this day" button share one row, so neither overlaps the other */
  .month-day .md-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
    width: 100%;
  }

  .month-day .md-date {
    font-size: 15px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .md-open {
    flex-shrink: 0;
    display: grid;
    place-items: center;
    width: 21px;
    height: 21px;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--surface);
    color: var(--text-soft);
    cursor: pointer;
    opacity: .5;
  }

  .month-day:hover .md-open,
  .md-open:hover,
  .md-open:focus-visible {
    opacity: 1;
    border-color: var(--accent);
    color: var(--accent-dark);
  }

  .month-day .md-count {
    margin-top: auto;
    font-size: 11px;
    font-weight: 700;
    color: var(--accent-dark);
    background: var(--accent-soft);
    border-radius: 999px;
    padding: 2px 8px;
    white-space: nowrap;
    max-width: 100%;
    overflow: hidden;
  }

  .month-day.closed {
    background: transparent;
    border-style: dashed;
  }

  .month-day.closed .md-date {
    color: var(--text-soft);
    font-weight: 600;
  }

  .month-day.other {
    opacity: .42;
  }

  .month-day.today {
    border-color: var(--accent);
  }

  .month-day.today .md-date {
    color: var(--accent-dark);
  }

  .month-day.sel {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent) inset;
  }

  /* ---------- Forms (modal + settings) ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(30, 20, 20, .42);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 50;
    padding: 0;
  }

  @media (min-width:640px) {
    .overlay {
      align-items: center;
      padding: 24px;
    }
  }

  .modal {
    background: var(--surface);
    width: 100%;
    max-width: 480px;
    max-height: 92vh;
    overflow-y: auto;
    border-radius: 20px 20px 0 0;
    padding: 24px 22px calc(24px + env(safe-area-inset-bottom, 0px));
    box-shadow: var(--shadow);
  }

  @media (min-width:640px) {
    .modal {
      border-radius: 20px;
    }
  }

  .modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }

  .modal-head h3 {
    margin: 0;
    font-size: 18px;
  }

  .modal-head .icon-btn {
    border: none;
  }

  .form-grid {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .form-row-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .form-row-2--with-btn {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr) auto;
    align-items: end;
  }

  /* the action button hugs its label instead of filling the row */
  .form-row-2--with-btn > .btn {
    justify-self: start;
  }

  .field select,
  .field textarea {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 13px;
    font-size: 14.5px;
    background: var(--bg);
    color: var(--text);
    outline: none;
    font-family: inherit;
  }

  .field select:focus,
  .field textarea:focus {
    border-color: var(--accent);
  }

  .field textarea {
    resize: vertical;
    min-height: 60px;
  }

  .hint {
    font-size: 12px;
    color: var(--text-soft);
  }

  .conflict-box {
    background: var(--danger-soft);
    color: var(--danger);
    border-radius: 10px;
    padding: 11px 13px;
    font-size: 13px;
    line-height: 1.6;
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }

  .conflict-box svg {
    flex-shrink: 0;
    margin-top: 2px;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }

  .modal-actions .btn {
    flex: 1;
  }

  /* ---------- Services & settings ---------- */
  .svc-table {
    width: 100%;
    border-collapse: collapse;
  }

  .svc-table th {
    text-align: right;
    font-size: 11.5px;
    color: var(--text-soft);
    font-weight: 700;
    padding: 0 18px 10px;
    text-transform: uppercase;
    letter-spacing: .03em;
  }

  .svc-table td {
    padding: 12px 18px;
    border-top: 1px solid var(--border);
    font-size: 14px;
    vertical-align: middle;
  }

  .svc-table input[type=text],
  .svc-table input[type=number] {
    border: 1px solid transparent;
    background: transparent;
    border-radius: 8px;
    padding: 6px 8px;
    font-size: 14px;
    color: var(--text);
    width: 100%;
    font-family: inherit;
  }

  .svc-table input:hover,
  .svc-table input:focus {
    border-color: var(--border);
    background: var(--bg);
  }

  .svc-table input[type=number] {
    width: 70px;
    font-variant-numeric: tabular-nums;
  }

  .toggle {
    width: 38px;
    height: 22px;
    border-radius: 999px;
    background: var(--border);
    position: relative;
    cursor: pointer;
    flex-shrink: 0;
    border: none;
    padding: 0;
  }

  .toggle.on {
    background: var(--accent);
  }

  .toggle .knob {
    position: absolute;
    top: 2px;
    inset-inline-start: 2px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #fff;
    transition: inset-inline-start .15s;
    box-shadow: 0 1px 2px rgba(0, 0, 0, .2);
  }

  .toggle.on .knob {
    inset-inline-start: 18px;
  }

  .add-service-row {
    display: flex;
    gap: 10px;
    padding: 16px 18px;
    flex-wrap: wrap;
    align-items: flex-end;
  }

  /* .field's bottom margin would push the inputs 16px above the button baseline */
  .add-service-row .field {
    margin-bottom: 0;
  }

  .section-title {
    font-size: 15.5px;
    font-weight: 700;
    margin: 0 0 2px;
  }

  .section-sub {
    font-size: 13px;
    color: var(--text-soft);
    margin: 0 0 14px;
  }

  .settings-block {
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .settings-block .section-sub {
    margin-bottom: 0;
  }

  /* Two columns so no single card has to stretch across the whole screen. */

        supa.from('business_settings').select('*').eq('id', 1).single(),
        debtsQuery(),
      ]);
      if (svcRes.error) throw svcRes.error;
      if (hoursRes.error) throw hoursRes.error;
      if (settingsRes.error) throw settingsRes.error;
      store.services = svcRes.data || [];
      store.businessHours = hoursRes.data || [];
      store.settings = settingsRes.data || null;
      if (debtsRes.error) {
        console.warn('debts unavailable:', debtsRes.error.message);
        store.debtsReady = !isMissingDebtsTable(debtsRes.error);
      }
      store.debts = debtsRes.data || [];
    } catch (err) {
      store.bootError = friendlyError(err);
    } finally {
      store.loadingStatic = false;
    }
  }

  /* ---------------- debts ---------------- */
  // A solo studio accumulates a handful of these a month, so the whole list
  // comes down at once and every filter and total below is computed locally.
  // Until add-debts.sql is run the table simply is not there; PostgREST says so
  // either by code (PGRST205 / 42P01) or in the message.
  function isMissingDebtsTable(err) {
    if (!err) return false;
    if (err.code === 'PGRST205' || err.code === '42P01') return true;
    return /schema cache|relation .*debts.* does not exist/i.test(err.message || '');
  }

  function debtsQuery() {
    return supa.from('debts').select('*, services(name)')
      .order('treatment_date', { ascending: false })
      .order('created_at', { ascending: false })
      .limit(500);
  }

  async function loadDebts() {
    if (!supa) return;
    const { data, error } = await debtsQuery();
    if (error) {
      store.debtsReady = !isMissingDebtsTable(error);
      // the screen explains the missing table on its own, no need to shout
      if (store.debtsReady) showToast(friendlyError(error), 'err');
      return;
    }
    store.debtsReady = true;
    store.debts = data || [];
  }

  const openDebts = () => store.debts.filter(d => d.status === 'open');

  // must match REMINDER_INTERVAL_DAYS in the debt-reminders Edge Function
  const REMINDER_INTERVAL_DAYS = 7;

  function fmtMoney(n) {
    const v = Number(n) || 0;
    return (Number.isInteger(v) ? v : Number(v.toFixed(2))).toLocaleString('he-IL');
  }
  function fmtISO(iso) { const [y, m, d] = iso.split('-'); return `${+d}/${+m}/${y}`; }
  function daysSince(iso) {
    const ms = parseISODate(iso.slice(0, 10)).getTime();
    return Math.max(0, Math.round((parseISODate(todayISO()).getTime() - ms) / 86400000));
  }

  async function loadAllServices() { // includes inactive, for the services screen
    if (!supa) return [];
    const { data, error } = await supa.from('services').select('*').order('sort_order');
    if (error) { showToast(friendlyError(error), 'err'); return []; }
    return data || [];
  }

  async function ensureDateLoaded(dateStr, force) {
    if (!supa) return [];
    if (!force && store.byDate[dateStr]) return store.byDate[dateStr];
    const { data, error } = await supa
      .from('appointments')
      .select('*, services(name, duration_minutes)')
      .eq('appointment_date', dateStr)
      .neq('status', 'cancelled')
      .order('start_time');
    if (error) { showToast(friendlyError(error), 'err'); return []; }
    store.byDate[dateStr] = data || [];
    return store.byDate[dateStr];
  }

  // one query for a whole span of days (the month grid), cached per day like
  // ensureDateLoaded so the day view reuses whatever the calendar already has
  async function ensureRangeLoaded(fromStr, toStr, force) {
    if (!supa) return;
    const days = [];
    for (let d = parseISODate(fromStr); toISODate(d) <= toStr; d = addDays(d, 1)) days.push(toISODate(d));
    if (!force && days.every(d => store.byDate[d])) return;
    const { data, error } = await supa
      .from('appointments')
      .select('*, services(name, duration_minutes)')
      .gte('appointment_date', fromStr)
      .lte('appointment_date', toStr)
      .neq('status', 'cancelled')
      .order('start_time');
    if (error) { showToast(friendlyError(error), 'err'); return; }
    const grouped = {};
    for (const day of days) grouped[day] = [];
    for (const a of data || []) if (grouped[a.appointment_date]) grouped[a.appointment_date].push(a);
    for (const day of days) store.byDate[day] = grouped[day];
  }

  function findConflict(dateStr, start, end, excludeId) {
    const list = store.byDate[dateStr] || [];
    const s = timeToMin(start), e = timeToMin(end);
    return list.find(a => a.id !== excludeId && a.status !== 'cancelled' &&
      s < timeToMin(a.end_time) && e > timeToMin(a.start_time));
  }

  /* ---------------- Month view ---------------- */
  const MonthView = {
    props: ['selected'],
    emits: ['open-day', 'update:selected'],
    setup(props, { emit }) {
      const anchor = ref(new Date(props.selected.getFullYear(), props.selected.getMonth(), 1));
      // always six rows from the Sunday before the 1st, so the grid never changes height
      const gridDays = computed(() => {
        const first = startOfWeek(anchor.value);
        return Array.from({ length: 42 }, (_, i) => addDays(first, i));
      });
      const monthLabel = computed(() => `${MONTHS[anchor.value.getMonth()]} ${anchor.value.getFullYear()}`);
      const todayStr = todayISO();
      const selStr = computed(() => toISODate(props.selected));

      watch(gridDays, (ds) => ensureRangeLoaded(toISODate(ds[0]), toISODate(ds[41])), { immediate: true });
      // follow the selected day into its own month (e.g. after picking a trailing day)
      watch(() => props.selected, (d) => {
        if (d.getFullYear() !== anchor.value.getFullYear() || d.getMonth() !== anchor.value.getMonth()) {
          anchor.value = new Date(d.getFullYear(), d.getMonth(), 1);
        }
      });

      const isThisMonth = computed(() => {
        const t = new Date();
        return anchor.value.getFullYear() === t.getFullYear() && anchor.value.getMonth() === t.getMonth();
      });
      function shiftMonth(n) { anchor.value = new Date(anchor.value.getFullYear(), anchor.value.getMonth() + n, 1); }
      function goToday() { emit('update:selected', new Date()); }
      function hoursFor(d) { return store.businessHours.find(h => h.day_of_week === d.getDay()); }
      function isClosed(d) { const h = hoursFor(d); return !!h && !h.is_open; }
      function countFor(d) { const list = store.byDate[toISODate(d)]; return list ? list.length : 0; }
      function inMonth(d) { return d.getMonth() === anchor.value.getMonth(); }

      return {
        gridDays, monthLabel, todayStr, selStr, isThisMonth, shiftMonth, goToday,
        isClosed, countFor, inMonth, toISODate, heDate, WEEKDAYS_SHORT,
      };
    },
    template: `
  <div class="month-view">
    <div class="view-nav">
      <button class="icon-btn" title="חודש קודם" @click="shiftMonth(-1)"><icon name="chevron-right" size="16"/></button>
      <button class="icon-btn" title="חודש הבא" @click="shiftMonth(1)"><icon name="chevron-left" size="16"/></button>

        :class="{ other: !inMonth(d), today: toISODate(d)===todayStr, sel: toISODate(d)===selStr, closed: isClosed(d) }"
        :title="heDate(d)" @click="$emit('update:selected', d)" @dblclick="$emit('open-day', d)"

  /* ---------------- New / Edit appointment modal ---------------- */
  const AppointmentModal = {
    props: ['editing', 'presetDate'],
    emits: ['close', 'saved'],
    setup(props, { emit }) {
      const isEdit = computed(() => !!props.editing);
      const form = reactive({
        service_id: props.editing ? props.editing.service_id : (store.services[0]?.id || ''),
        date: props.editing ? props.editing.appointment_date : (props.presetDate || todayISO()),
        start_time: props.editing ? fmtTime(props.editing.start_time) : '',
        client_name: props.editing ? props.editing.client_name : '',
        client_phone: props.editing ? props.editing.client_phone : '',
        notes: props.editing ? (props.editing.notes || '') : '',
      });
      const saving = ref(false);
      const loadingSlots = ref(false);
      const service = computed(() => store.services.find(s => s.id === form.service_id));
      const endTime = computed(() => service.value && form.start_time ? addMinToTime(form.start_time, service.value.duration_minutes) : '');
      const dayHours = computed(() => store.businessHours.find(h => h.day_of_week === parseISODate(form.date).getDay()));

      // appointments on the chosen date that count as "taken" -- excludes the appointment
      // being edited, so its own current slot stays selectable.
      const busyList = computed(() => (store.byDate[form.date] || [])
        .filter(a => a.status !== 'cancelled' && (!props.editing || a.id !== props.editing.id)));

      // every start time, in 5-minute steps, where the selected service fits inside business
      // hours without overlapping an existing appointment -- the only times shown to pick from.
      const availableSlots = computed(() => {
        const dur = service.value?.duration_minutes;
        const hours = dayHours.value;
        if (!dur || !hours || !hours.is_open) return [];
        const openMin = timeToMin(hours.open_time), closeMin = timeToMin(hours.close_time);
        const busy = busyList.value;
        const slots = [];
        for (let t = openMin; t + dur <= closeMin; t += 5) {
          const end = t + dur;
          if (!busy.some(a => t < timeToMin(a.end_time) && end > timeToMin(a.start_time))) slots.push(minToTime(t));
        }
        return slots;
      });

      // default pick: 5 minutes after the last appointment of the day ends, snapped to the
      // nearest free slot at or after that -- otherwise the day's first free slot.
      const suggestedStart = computed(() => {
        const slots = availableSlots.value;
        if (!slots.length) return '';
        const hours = dayHours.value;
        const busy = busyList.value;
        let candidate = timeToMin(hours.open_time);
        if (busy.length) candidate = Math.max(candidate, Math.max(...busy.map(a => timeToMin(a.end_time))) + 5);
        return slots.find(s => timeToMin(s) >= candidate) || slots[0];
      });

      async function refreshAvailability() {
        loadingSlots.value = true;
        await ensureDateLoaded(form.date, true);
        loadingSlots.value = false;
        if (!availableSlots.value.includes(form.start_time)) form.start_time = suggestedStart.value;
      }
      watch(() => [form.date, form.service_id], refreshAvailability, { immediate: true });

      async function save() {
        if (!form.service_id || !form.start_time || !form.client_name.trim() || !form.client_phone.trim()) {
          showToast('נא לבחור שעה פנויה ולמלא שם וטלפון', 'err'); return;
        }
        // last-moment safety net in case another booking landed while this modal was open
        await ensureDateLoaded(form.date, true);
        const conflict = findConflict(form.date, form.start_time, endTime.value, props.editing ? props.editing.id : null);
        if (conflict) { showToast('השעה הזו נתפסה הרגע על ידי תור אחר, בחרי שעה אחרת', 'err'); await refreshAvailability(); return; }
        saving.value = true;
        const payload = {
          service_id: form.service_id,
          appointment_date: form.date,
          start_time: form.start_time,
          end_time: endTime.value,
          client_name: form.client_name.trim(),
          client_phone: form.client_phone.trim(),
          notes: form.notes.trim() || null,
        };
        try {
          let error;
          if (isEdit.value) {
            ({ error } = await supa.from('appointments').update(payload).eq('id', props.editing.id));
          } else {
            ({ error } = await supa.from('appointments').insert(payload));
          }
          if (error) throw error;
          await ensureDateLoaded(form.date, true);
          if (isEdit.value && props.editing.appointment_date !== form.date) await ensureDateLoaded(props.editing.appointment_date, true);
          showToast(isEdit.value ? 'התור עודכן' : 'התור נקבע בהצלחה');
          emit('saved');
        } catch (err) {
          showToast(friendlyError(err), 'err');
        } finally {
          saving.value = false;
        }
      }

      return { form, isEdit, service, endTime, availableSlots, loadingSlots, saving, save, store };
    },
    template: `
  <div class="overlay" @click.self="$emit('close')">
    <div class="modal">
      <div class="modal-head">
        <h3>{{ isEdit ? 'עריכת תור' : 'תור חדש' }}</h3>
        <button class="icon-btn" title="סגירה" @click="$emit('close')"><icon name="x" size="16"/></button>
      </div>
      <div class="form-grid">
        <div class="field">
          <label for="f-service">סוג טיפול</label>
          <select id="f-service" v-model="form.service_id">
            <option v-for="s in store.services" :key="s.id" :value="s.id">{{ s.name }} · {{ s.duration_minutes }} דק׳</option>
          </select>
        </div>
        <div class="form-row-2">
          <div class="field">
            <label for="f-date">תאריך</label>
            <input id="f-date" type="date" v-model="form.date">
          </div>
          <div class="field">
            <label for="f-time">שעת התחלה</label>
            <select id="f-time" v-model="form.start_time" :disabled="loadingSlots || !availableSlots.length">
              <option v-if="loadingSlots" value="">טוענת שעות פנויות…</option>
              <option v-else-if="!availableSlots.length" value="">אין שעות פנויות</option>
              <option v-for="t in availableSlots" :key="t" :value="t">{{ t }}</option>
            </select>
          </div>
        </div>
        <div class="hint" v-if="service && form.start_time">סיום משוער: {{ endTime }} ({{ service.duration_minutes }} דקות)</div>
        <div class="conflict-box" v-if="!loadingSlots && !availableSlots.length">
          <icon name="alert-triangle" size="15"/> אין שעות פנויות ביום הזה לטיפול שנבחר. נסי תאריך אחר או טיפול קצר יותר.
        </div>
        <div class="form-row-2">
          <div class="field">
            <label for="f-name">שם הלקוחה</label>
            <input id="f-name" type="text" v-model="form.client_name">
          </div>
          <div class="field">
            <label for="f-phone">טלפון</label>
            <input id="f-phone" type="tel" v-model="form.client_phone" dir="ltr" style="text-align:left">
          </div>
        </div>
        <div class="field">
          <label for="f-notes">הערות (אופציונלי)</label>
          <textarea id="f-notes" v-model="form.notes" placeholder="לדוגמה: רגישות לחומר מסוים"></textarea>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" @click="$emit('close')">ביטול</button>
        <button class="btn btn-primary" :disabled="saving" @click="save">{{ saving ? 'שומרת…' : 'שמירת תור' }}</button>
      </div>
    </div>
  </div>`
  };

  /* ---------------- New / Edit debt modal ---------------- */
  const DebtModal = {
    props: ['editing'],
    emits: ['close', 'saved'],
    setup(props, { emit }) {
      const isEdit = computed(() => !!props.editing);
      const e = props.editing;
      const form = reactive({
        client_name: e ? e.client_name : '',
        client_phone: e ? e.client_phone : '',
        client_email: e ? (e.client_email || '') : '',
        amount: e ? e.amount : '',
        treatment_date: e ? e.treatment_date : todayISO(),
        notes: e ? (e.notes || '') : '',
        service_id: e ? (e.service_id || '') : '',
        appointment_id: e ? (e.appointment_id || '') : '',
      });
      const saving = ref(false);
      const recent = ref([]);
      const pickedAppt = ref('');

      // Most debts follow a treatment that is already in the system, so the
      // last three months of appointments can fill the whole form in one pick.
      onMounted(async () => {
        if (isEdit.value || !supa) return;
        const { data } = await supa.from('appointments')
          .select('id, client_name, client_phone, appointment_date, service_id, services(name, price)')
          .gte('appointment_date', toISODate(addDays(new Date(), -90)))
          .lte('appointment_date', todayISO())
          .neq('status', 'cancelled')
          .order('appointment_date', { ascending: false })
          .limit(60);
        recent.value = data || [];
      });

      function applyAppointment(id) {
        const a = recent.value.find(x => x.id === id);
        if (!a) return;
        form.client_name = a.client_name;
        form.client_phone = a.client_phone;
        form.treatment_date = a.appointment_date;
        form.service_id = a.service_id || '';
        form.appointment_id = a.id;
        if (a.services && a.services.price != null) form.amount = a.services.price;
      }

      const emailLooksValid = computed(() => {
        const v = form.client_email.trim();
        return !v || /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v);
      });

      async function save() {
        if (!form.client_name.trim() || !form.client_phone.trim()) { showToast('נא למלא שם וטלפון', 'err'); return; }
        if (!(Number(form.amount) > 0)) { showToast('נא למלא סכום חוב', 'err'); return; }
        if (!emailLooksValid.value) { showToast('כתובת המייל לא נראית תקינה', 'err'); return; }

        const payload = {
          client_name: form.client_name.trim(),
          client_phone: form.client_phone.trim(),
          client_email: form.client_email.trim() || null,
          amount: Number(form.amount),
          treatment_date: form.treatment_date,
          notes: form.notes.trim() || null,
          service_id: form.service_id || null,
          appointment_id: form.appointment_id || null,
        };

        saving.value = true;
        try {
          if (isEdit.value) {
            const { error } = await supa.from('debts').update(payload).eq('id', props.editing.id);
            if (error) throw error;
            showToast('החוב עודכן');
          } else {
            const { data, error } = await supa.from('debts').insert(payload).select('id').single();
            if (error) throw error;
            if (!payload.client_email) {
              showToast('החוב נשמר. בלי כתובת מייל לא יישלחו תזכורות');
            } else {
              // first reminder goes out now; the weekly ones are the cron job's
              try {
                const res = await supa.functions.invoke('debt-reminders', { body: { debt_id: data.id } });
                if (res.error) throw res.error;
                if (res.data && res.data.ok === false) throw new Error(describeSendFailure(res.data));
                showToast('החוב נשמר והתזכורת הראשונה נשלחה');
              } catch (sendErr) {
                showToast('החוב נשמר, אבל שליחת התזכורת נכשלה: ' + friendlyError(sendErr), 'err');
              }
            }
          }
          emit('saved');
        } catch (err) {
          showToast(friendlyError(err), 'err');
        } finally {
          saving.value = false;
        }
      }

      return { isEdit, form, saving, recent, pickedAppt, applyAppointment, emailLooksValid, save, fmtISO };
    },

  // turns the Edge Function's per-debt failure report into one readable line
  function describeSendFailure(data) {
    if (data && data.failed && data.failed.length) return data.failed[0].error;
    return (data && data.error) || 'שליחת התזכורת נכשלה';

  /* ---------------- Debts view ---------------- */
  const DebtsView = {
    emits: ['edit-debt'],
    setup() {
      const filter = ref('open');

      const paid = computed(() => store.debts.filter(d => d.status === 'paid'));
      const list = computed(() =>
        filter.value === 'open' ? open.value : filter.value === 'paid' ? paid.value : store.debts);

      const openTotal = computed(() => open.value.reduce((t, d) => t + Number(d.amount), 0));
      const oldest = computed(() => open.value.reduce(
        (best, d) => (!best || d.treatment_date < best.treatment_date ? d : best), null));
      const paidLast30 = computed(() => {
        const since = toISODate(addDays(new Date(), -30));
        return paid.value
          .filter(d => d.paid_at && toISODate(new Date(d.paid_at)) >= since)
          .reduce((t, d) => t + Number(d.amount), 0);
      });
      // what the daily sweep would pick up right now
      const dueNow = computed(() => open.value.filter(d => d.client_email && (
        !d.last_reminder_at || daysSince(d.last_reminder_at) >= REMINDER_INTERVAL_DAYS)).length);

      /* --- the one line under each client that says how the chasing is going --- */
      function reminderCount(n) { return n === 1 ? 'תזכורת אחת' : `${n} תזכורות`; }
      function remState(d) {
        if (d.status === 'paid') {
          return { cls: '', icon: 'check-circle', text: d.reminders_sent
            ? `שולם · נשלחה ${reminderCount(d.reminders_sent)}` : 'שולם' };
        }
        if (!d.client_email) return { cls: 'warn', icon: 'alert-triangle', text: 'אין מייל — לא נשלחות תזכורות' };
        if (!d.reminders_sent || !d.last_reminder_at) return { cls: '', icon: 'mail', text: 'עדיין לא נשלחה תזכורת' };
        const next = addDays(parseISODate(d.last_reminder_at.slice(0, 10)), REMINDER_INTERVAL_DAYS);
        return { cls: 'sent', icon: 'mail', text: `${reminderCount(d.reminders_sent)} · הבאה ב-${fmtISO(toISODate(next))}` };
      }

      async function togglePaid(d) {
        const paying = d.status === 'open';
        const { error } = await supa.from('debts').update({
          status: paying ? 'paid' : 'open',

        await loadDebts();
        showToast(paying ? 'החוב סומן כשולם' : 'החוב חזר למצב פתוח');

      async function removeDebt(d) {
        if (!window.confirm(`למחוק את החוב של ${d.client_name} (${fmtMoney(d.amount)} ₪)?`)) return;
        const { error } = await supa.from('debts').delete().eq('id', d.id);
        if (error) { showToast(friendlyError(error), 'err'); return; }
        await loadDebts();
        showToast('החוב נמחק');
      }

      async function remindOne(d) {
        if (!d.client_email) { showToast('אין מייל ללקוחה הזו — אפשר להוסיף אותו בעריכה', 'err'); return; }
        sendingId.value = d.id;
        try {
          const { data, error } = await supa.functions.invoke('debt-reminders', { body: { debt_id: d.id } });
          if (error) throw error;
          if (data && data.ok === false) throw new Error(describeSendFailure(data));
          await loadDebts();
          showToast(`התזכורת נשלחה ל${d.client_name}`);
        } catch (err) {
          showToast(friendlyError(err), 'err');
        } finally {
          sendingId.value = '';
        }
      }

      // same sweep the cron job runs every morning, on demand
      async function remindAllDue() {
        sweeping.value = true;
        try {
          const { data, error } = await supa.functions.invoke('debt-reminders', { body: {} });
          if (error) throw error;
          if (data && data.ok === false) throw new Error(describeSendFailure(data));
          await loadDebts();
          const sent = (data && data.sent) || 0;
          showToast(sent ? `נשלחו ${sent} תזכורות` : 'אין תזכורות שממתינות לשליחה');
        } catch (err) {
          showToast(friendlyError(err), 'err');
        } finally {
          sweeping.value = false;
        }
      }

      return {
        filter, list, open, paid, store, openTotal, oldest, paidLast30, dueNow,
        sendingId, sweeping, remState, togglePaid, removeDebt, remindOne, remindAllDue,
        fmtMoney, fmtISO, daysSince,
      };

        @click="remindAllDue">

    <div class="card">

              {{ fmtISO(d.treatment_date) }}

            </div>

            </div>

          <div class="debt-actions">
            <button class="icon-btn" v-if="d.status==='open'" :disabled="sendingId===d.id"
              title="שליחת תזכורת עכשיו" @click="remindOne(d)"><icon name="mail" size="15"/></button>
            <button class="icon-btn" :title="d.status==='open' ? 'סימון כשולם' : 'החזרה למצב פתוח'"

  /* ---------------- Settings view ---------------- */
  const SettingsView = {
    setup() {
      const name = ref(store.settings?.business_name || '');
      const email = ref(store.settings?.owner_email || '');
      const savingInfo = ref(false);
      const hours = reactive(store.businessHours.map(h => ({ ...h })));
      const savingHours = ref(false);
      const sendingReport = ref(false);

      /* --- week at a glance: derived live from the hours being edited --- */
      function span(h) {
        if (!h.is_open || !h.open_time || !h.close_time) return 0;
        return Math.max(0, timeToMin(h.close_time) - timeToMin(h.open_time));
      }
      const openDays = computed(() => hours.filter(h => span(h) > 0));
      const weeklyMinutes = computed(() => openDays.value.reduce((t, h) => t + span(h), 0));
      const weeklyHoursLabel = computed(() => {
        const m = weeklyMinutes.value;
        return m % 60 ? `${Math.floor(m / 60)}:${pad(m % 60)}` : String(Math.floor(m / 60));
      });
      const scale = computed(() => {
        if (!openDays.value.length) return { from: 480, to: 1200 };
        const from = Math.floor(Math.min(...openDays.value.map(h => timeToMin(h.open_time))) / 60) * 60;
        const to = Math.ceil(Math.max(...openDays.value.map(h => timeToMin(h.close_time))) / 60) * 60;
        return { from, to: Math.max(to, from + 60) };
      });
      const scaleMid = computed(() => Math.round((scale.value.from + scale.value.to) / 120) * 60);
      function barStyle(h) {
        const { from, to } = scale.value, width = to - from;
        const offset = (timeToMin(h.open_time) - from) / width * 100;
        return { insetInlineStart: offset + '%', width: Math.max(span(h) / width * 100, 2) + '%' };
      }
      const longestDay = computed(() => {
        let best = null;
        for (const h of openDays.value) if (!best || span(h) > span(best)) best = h;
        return best;
      });
      const avgService = computed(() => {
        const d = (store.services || []).map(s => s.duration_minutes).filter(Boolean);
        return d.length ? Math.round(d.reduce((a, b) => a + b, 0) / d.length) : 0;
      });
      const capacity = computed(() => avgService.value ? Math.floor(weeklyMinutes.value / avgService.value) : 0);

      async function sendReportNow() {
        sendingReport.value = true;
        try {
          const { data, error } = await supa.functions.invoke('daily-schedule-email', { method: 'POST' });
          if (error) throw error;
          if (data && data.ok === false) throw new Error(data.error || 'שליחת הדוח נכשלה');
          showToast(`הדוח של היום נשלח בהצלחה (${data?.count ?? 0} תורים)`);
        } catch (err) {
          showToast(friendlyError(err), 'err');
        } finally {
          sendingReport.value = false;
        }
      }

      async function saveInfo() {
        savingInfo.value = true;
        const { error } = await supa.from('business_settings')
          .update({ business_name: name.value.trim(), owner_email: email.value.trim() }).eq('id', 1);
        savingInfo.value = false;
        if (error) { showToast(friendlyError(error), 'err'); return; }
        store.settings = { ...store.settings, business_name: name.value.trim(), owner_email: email.value.trim() };
        showToast('הפרטים נשמרו');
      }
      async function saveHours() {
        savingHours.value = true;
        try {
          for (const h of hours) {
            const { error } = await supa.from('business_hours')
              .update({ is_open: h.is_open, open_time: h.open_time, close_time: h.close_time })
              .eq('day_of_week', h.day_of_week);
            if (error) throw error;
          }
          store.businessHours = hours.map(h => ({ ...h }));
          showToast('שעות הפעילות נשמרו');
        } catch (err) { showToast(friendlyError(err), 'err'); }
        finally { savingHours.value = false; }
      }
      return {
        name, email, savingInfo, hours, savingHours, sendingReport, saveInfo, saveHours, sendReportNow,
        openDays, weeklyHoursLabel, scale, scaleMid, barStyle, longestDay, avgService, capacity, span,
        WEEKDAYS, fmtTime, minToTime, Math,
      };
    },
    template: `
  <div class="settings-grid">
    <div class="card settings-block">
      <div>
        <p class="section-title">פרטי העסק</p>
        <p class="section-sub">כתובת המייל כאן היא היעד לדוח התורים היומי שנשלח כל בוקר ב-07:00.</p>
      </div>
      <div class="form-row-2 form-row-2--with-btn" style="margin-top:auto">
        <div class="field" style="margin-bottom:0"><label for="s-name">שם העסק</label><input id="s-name" type="text" v-model="name"></div>
        <div class="field" style="margin-bottom:0"><label for="s-email">אימייל לדוח היומי</label><input id="s-email" type="email" v-model="email" dir="ltr" style="text-align:left"></div>
        <button class="btn btn-primary" style="height:44px;padding-block:0" :disabled="savingInfo" @click="saveInfo">{{ savingInfo?'שומרת…':'שמירה' }}</button>
      </div>
    </div>

    <div class="card settings-block">
      <div>
        <p class="section-title">דוח יומי</p>
        <p class="section-sub">הדוח יוצא אוטומטית כל בוקר ב-07:00 לכתובת שלמעלה. לא רוצה לחכות? אפשר לשלוח את דוח התורים של היום עכשיו.</p>
      </div>
      <button class="btn btn-ghost" style="align-self:flex-start;padding-inline:22px;margin-top:auto" :disabled="sendingReport" @click="sendReportNow">
        <icon name="calendar" size="16"/>{{ sendingReport?'שולחת…':'שליחת הדוח של היום עכשיו' }}
      </button>
    </div>

    <div class="card settings-block">
      <div>
        <p class="section-title">שעות פעילות</p>
        <p class="section-sub">קובעות באילו ימים אפשר לקבוע תור ובאילו שעות.</p>
      </div>
      <div>
        <div class="hours-row" v-for="h in hours" :key="h.day_of_week">
          <div class="day-name">{{ WEEKDAYS[h.day_of_week] }}</div>
          <button class="toggle" :class="{on:h.is_open}" @click="h.is_open=!h.is_open"><span class="knob"></span></button>
          <template v-if="h.is_open">
            <input type="time" v-model="h.open_time">
            <span class="to">עד</span>
            <input type="time" v-model="h.close_time">
          </template>
          <span class="closed-label" v-else>סגור</span>
        </div>
      </div>
      <button class="btn btn-primary" style="align-self:flex-start;padding-inline:22px;margin-top:auto" :disabled="savingHours" @click="saveHours">{{ savingHours?'שומרת…':'שמירת שעות' }}</button>
    </div>

    <div class="card settings-block">
      <div>
        <p class="section-title">השבוע במבט אחד</p>
        <p class="section-sub">תמונת מצב של שבוע העבודה, מתעדכנת בזמן אמת לפי השעות שבצד.</p>
      </div>
      <div class="stat-row">
        <div class="stat"><div class="v">{{ weeklyHoursLabel }}</div><div class="k">שעות פתיחה בשבוע</div></div>
        <div class="stat"><div class="v">{{ openDays.length }}</div><div class="k">ימי עבודה</div></div>
        <div class="stat"><div class="v">{{ longestDay ? WEEKDAYS[longestDay.day_of_week] : '—' }}</div><div class="k">היום הארוך בשבוע</div></div>
      </div>
      <div class="week-bars">
        <div class="week-bar" :class="{off:!h.is_open}" v-for="h in hours" :key="h.day_of_week"
          :title="h.is_open ? WEEKDAYS[h.day_of_week] + ': ' + fmtTime(h.open_time) + '–' + fmtTime(h.close_time) : WEEKDAYS[h.day_of_week] + ': סגור'">
          <span class="wb-day">{{ WEEKDAYS[h.day_of_week] }}</span>
          <span class="track"><span class="fill" v-if="span(h)" :style="barStyle(h)"></span></span>
          <span class="wb-note">{{ h.is_open ? Math.round(span(h) / 6) / 10 + 'ש׳' : '—' }}</span>
        </div>
      </div>
      <div class="scale-row">
        <span>{{ minToTime(scale.from) }}</span>
        <span>{{ minToTime(scaleMid) }}</span>
        <span>{{ minToTime(scale.to) }}</span>
      </div>
      <p class="hint" style="margin-top:auto" v-if="capacity">
        משך טיפול ממוצע {{ avgService }} דק׳ — יש מקום לכ-{{ capacity }} תורים בשבוע.
      </p>
      <p class="hint" style="margin-top:auto" v-else>אחרי שמוסיפים טיפולים נראה כאן גם כמה תורים נכנסים בשבוע.</p>
    </div>
  </div>`
  };

  /* ---------------- App shell ---------------- */
  const AppShell = {
    components: { TodayView, MonthView, DebtsView, ServicesView, SettingsView, AppointmentModal, DebtModal },
    setup() {
      const view = ref('today');
      const selectedDate = ref(new Date());
      const modalOpen = ref(false);
      const editingAppt = ref(null);
      const debtModalOpen = ref(false);
      const editingDebt = ref(null);

      function openNew() { editingAppt.value = null; modalOpen.value = true; }
      function openEdit(appt) { editingAppt.value = appt; modalOpen.value = true; }
      function closeModal() { modalOpen.value = false; editingAppt.value = null; }
      function onSaved() { closeModal(); }
      function openDay(d) { selectedDate.value = d; view.value = 'today'; }

      function openNewDebt() { editingDebt.value = null; debtModalOpen.value = true; }
      function openEditDebt(debt) { editingDebt.value = debt; debtModalOpen.value = true; }
      function closeDebtModal() { debtModalOpen.value = false; editingDebt.value = null; }
      async function onDebtSaved() { closeDebtModal(); await loadDebts(); }

      // the floating button belongs to whichever screen can create something
      const fabLabel = computed(() => view.value === 'debts' ? 'חוב חדש' : 'תור חדש');
      function onFab() { view.value === 'debts' ? openNewDebt() : openNew(); }
      const openDebtCount = computed(() => openDebts().length);

      async function logout() { await supa.auth.signOut(); store.session = null; }

      const titles = { today: 'היום', month: 'החודש', debts: 'חובות', services: 'הטיפולים שלי', settings: 'הגדרות' };
      const subtitle = computed(() => view.value === 'today' ? heDate(selectedDate.value) : '');

      return {
        view, selectedDate, modalOpen, editingAppt, openNew, openEdit, closeModal, onSaved, openDay,
        debtModalOpen, editingDebt, openNewDebt, openEditDebt, closeDebtModal, onDebtSaved,
        fabLabel, onFab, openDebtCount, logout, titles, subtitle, store, toISODate,
      };
    },
    template: `
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><div class="mark">G</div><span>Glow Studio</span></div>
      <button class="nav-item" :class="{active:view==='today'}" @click="view='today'"><span class="ic"><icon name="calendar" size="18"/></span>היום</button>
      <button class="nav-item" :class="{active:view==='month'}" @click="view='month'"><span class="ic"><icon name="calendar-week" size="18"/></span>החודש</button>
      <button class="nav-item" :class="{active:view==='debts'}" @click="view='debts'"><span class="ic"><icon name="wallet" size="18"/></span>חובות<span class="count" v-if="openDebtCount">{{ openDebtCount }}</span></button>
      <button class="nav-item" :class="{active:view==='services'}" @click="view='services'"><span class="ic"><icon name="sparkles" size="18"/></span>טיפולים</button>
      <button class="nav-item" :class="{active:view==='settings'}" @click="view='settings'"><span class="ic"><icon name="sliders" size="18"/></span>הגדרות</button>
      <div class="sidebar-footer">
        <div class="user-email" dir="ltr">{{ store.session?.user?.email }}</div>
        <button class="nav-item" @click="logout"><span class="ic"><icon name="log-out" size="18"/></span>התנתקות</button>
      </div>
    </aside>

    <div class="main">
      <div class="topbar">
        <div>
          <h2>{{ titles[view] }}</h2>
          <div class="sub" v-if="subtitle">{{ subtitle }}</div>
        </div>
      </div>
      <div class="content" :class="{'has-fab': view==='today' || view==='month' || view==='debts'}">
        <today-view v-if="view==='today'" :selected="selectedDate" @update:selected="selectedDate=$event" @new-appt="openNew" @edit-appt="openEdit" />
        <month-view v-else-if="view==='month'" :selected="selectedDate" @update:selected="selectedDate=$event" @open-day="openDay" />
        <debts-view v-else-if="view==='debts'" @edit-debt="openEditDebt" />
        <services-view v-else-if="view==='services'" />
        <settings-view v-else-if="view==='settings'" />
      </div>
    </div>

    <button class="fab" @click="onFab" v-if="view==='today' || view==='month' || view==='debts'"><icon name="plus" size="17"/> {{ fabLabel }}</button>

    <nav class="tabbar">
      <button :class="{active:view==='today'}" @click="view='today'"><span class="ic"><icon name="calendar" size="18"/></span>היום</button>
      <button :class="{active:view==='month'}" @click="view='month'"><span class="ic"><icon name="calendar-week" size="18"/></span>החודש</button>
      <button :class="{active:view==='debts'}" @click="view='debts'"><span class="ic"><icon name="wallet" size="18"/></span>חובות</button>
      <button :class="{active:view==='services'}" @click="view='services'"><span class="ic"><icon name="sparkles" size="18"/></span>טיפולים</button>
      <button :class="{active:view==='settings'}" @click="view='settings'"><span class="ic"><icon name="sliders" size="18"/></span>הגדרות</button>
    </nav>

    <appointment-modal v-if="modalOpen" :editing="editingAppt" :preset-date="toISODate(selectedDate)" @close="closeModal" @saved="onSaved" />
    <debt-modal v-if="debtModalOpen" :editing="editingDebt" @close="closeDebtModal" @saved="onDebtSaved" />
  </div>`
  };

  /* ---------------- Root ---------------- */
  const Root = {
    components: { LoginView, AppShell },
    setup() {
      const checkingSession = ref(true);

      onMounted(async () => {
        if (supa) {
          const { data } = await supa.auth.getSession();
          store.session = data.session;
          supa.auth.onAuthStateChange((_event, session) => { store.session = session; });
          if (store.session) await loadStaticData();
        }
        checkingSession.value = false;
      });

      watch(() => store.session, async (s) => { if (s) await loadStaticData(); });

      return { checkingSession, store, toast };
    },
    template: `
  <div v-if="checkingSession"></div>
  <login-view v-else-if="!store.session" />
  <div v-else-if="store.bootError" class="login-screen">
    <div class="login-card">
      <div class="login-error">{{ store.bootError }}</div>
      <p class="hint">נסי לרענן את הדף בעוד רגע.</p>
    </div>
  </div>
  <app-shell v-else />
  <div class="toast" :class="toast.type==='err'?'err':'ok'" v-if="toast.show">{{ toast.msg }}</div>`
  };

  const app = createApp(Root);
  app.component('icon', Icon);
  app.mount('#app');
</script>
